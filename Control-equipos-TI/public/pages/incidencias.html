<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incidencias - Control de Equipos TI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css">
  <link rel="stylesheet" href="../assets/css/Styles.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>

  <div class="dashboard-layout">
    <!-- Overlay para cerrar el menú en móviles -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Contenedor dinámico de la barra lateral -->
    <div id="sidebar-container"></div>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <header class="topbar">
        <div class="topbar__left">
          <button class="btn-toggle-sidebar" id="btn-toggle-sidebar" aria-label="Abrir Menú">
            <i class="ri-menu-line"></i>
          </button>
          <h2>Gestión de Solicitudes</h2>
        </div>

        <div class="user-profile">
          <i class="ri-user-3-fill"></i>
          <strong id="nombre-usuario">Cargando...</strong>
          <small id="rol-usuario" class="badge"></small>
        </div>
      </header>

      <!-- KPI CARDS DE INCIDENCIAS -->
      <section class="kpi-grid">
        <div class="kpi-card kpi-card--teal">
          <i class="ri-clipboard-line"></i>
          <div>
            <h3 id="kpi-total-incidencias">0</h3>
            <p>Total Incidencias</p>
          </div>
        </div>
        <div class="kpi-card kpi-card--purpura">
          <i class="ri-time-line"></i>
          <div>
            <h3 id="kpi-proceso">0</h3>
            <p>En Proceso</p>
          </div>
        </div>
        <div class="kpi-card kpi-card--coral">
          <i class="ri-alert-line"></i>
          <div>
            <h3 id="kpi-pendientes">0</h3>
            <p>Pendientes</p>
          </div>
        </div>
      </section>

      <!-- TABLA DE INCIDENCIAS -->
      <section class="panel-section">
        <div class="panel-header">
          <h3>Reportes y Fallas de Equipos</h3>
          
          <div class="panel-actions">
            <div class="search-box">
              <i class="ri-search-line search-icon"></i>
              <input 
                type="search" 
                id="inputBuscar" 
                placeholder="Buscar por tipo, descripción, usuario..." 
                autocomplete="off"
              >
            </div>
          </div>
        </div>

        <div class="table-responsive">
          <table class="data-table">
            <thead>
            <tr>
              <th>ID</th>
              <th>Equipo</th>
              <th>Usuario</th>
              <th>Mensaje / Descripción</th>
              <th>Fecha</th>
              <th>Estado</th>
            </tr>
            </thead>
              <tbody id="tabla-incidencias-body">
             </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- Scripts del sistema -->
   <script src="../assets/js/dashboard.js"></script>
  <script src="../assets/js/incidencias.js"></script>
  <script src="/assets/js/sidebar.js"></script>
</body>
</html>
</html>
